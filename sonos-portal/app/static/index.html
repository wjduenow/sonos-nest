<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sonos Nest Portal</title>
  <style>
    :root {
      --bg: #f4f5f7; --card: #ffffff; --ink: #1a1d21; --muted: #6b7280;
      --line: #e3e6ea; --accent: #3b6cf6; --ok: #22a06b; --off: #b0b6be;
      --bad: #e5484d; --warn: #c77700;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181c; --card: #22262c; --ink: #e8eaed; --muted: #9aa1ab;
        --line: #333941; --accent: #6c8cff; --ok: #3ecf8e; --off: #555c66;
        --bad: #ff6369; --warn: #e2a53a;
        --shadow: 0 1px 3px rgba(0,0,0,.4);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    header {
      display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
      padding: 22px 20px 6px; max-width: 900px; margin: 0 auto;
    }
    header h1 { font-size: 20px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
    header .sub { color: var(--muted); font-size: 13px; }
    .zones { max-width: 900px; margin: 0 auto; padding: 0 20px 14px; color: var(--muted); font-size: 13px; }
    .zones b { color: var(--ink); font-weight: 600; }
    main { max-width: 900px; margin: 0 auto; padding: 0 20px 40px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px;
    }
    .card.stale { opacity: .62; }
    .row { display: flex; align-items: center; gap: 9px; }
    /* Name on its own row, form-factor pill on the row below — so long names never crowd it. */
    .head { display: flex; flex-direction: column; align-items: flex-start; gap: 7px; }
    .name { font-weight: 620; font-size: 16px; overflow-wrap: anywhere; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--off); flex: none; }
    .dot.on { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
    /* Form-factor pill — tinted per unit type so it pops. --c drives text/border/background. */
    .badge {
      --c: var(--muted);
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
      color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 45%, var(--line));
      background: color-mix(in srgb, var(--c) 14%, transparent);
      border-radius: 999px; padding: 2px 9px;
    }
    .badge.nest   { --c: #6366f1; }   /* indigo */
    .badge.sleep  { --c: #0ea5a3; }   /* teal   */
    .badge.button { --c: #d97706; }   /* amber  */
    @media (prefers-color-scheme: dark) {
      .badge.nest   { --c: #a5b4fc; }
      .badge.sleep  { --c: #5eead4; }
      .badge.button { --c: #fbbf24; }
    }
    .meta { color: var(--muted); font-size: 13px; display: grid; gap: 5px; }
    .meta code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
    .meta .warn { color: var(--warn); }
    /* Labeled key/value rows for IP / Firmware / Board / mDNS. */
    .kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; align-items: baseline; }
    .kv .k { color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
    .kv .v { color: var(--ink); overflow-wrap: anywhere; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      font-size: 11px; font-weight: 600; border-radius: 999px; padding: 2px 8px;
      border: 1px solid var(--line); color: var(--muted);
    }
    .chip.ok  { color: var(--ok);  border-color: color-mix(in srgb, var(--ok)  40%, var(--line)); }
    .chip.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
    .chip.ota { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
    .spacer { flex: 1; }
    .actions { display: flex; gap: 8px; margin-top: 2px; }
    a.btn {
      appearance: none; border: 1px solid var(--line); background: transparent; color: var(--ink);
      font: inherit; font-size: 13px; font-weight: 550; text-decoration: none; cursor: pointer;
      padding: 7px 12px; border-radius: 8px; text-align: center;
    }
    a.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    a.btn.disabled { opacity: .5; pointer-events: none; }
    .empty { color: var(--muted); text-align: center; padding: 60px 0; }
    footer { max-width: 900px; margin: 0 auto; padding: 0 20px 30px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>Sonos Nest Portal</h1>
    <span class="sub" id="summary">loading…</span>
  </header>
  <div class="zones" id="zones"></div>
  <main>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>
      No devices yet. Power on a sonos-nest device on this network — it registers automatically.
    </div>
  </main>
  <footer id="portalInfo"></footer>

  <script>
    // Relative URLs on purpose: works at "/" (standalone) AND under HA ingress's
    // /api/hassio_ingress/<token>/ prefix without knowing the base path.
    const API = (p) => new URL(p, document.baseURI).toString();

    const UNIT_LABEL = { nest: "Nest (round)", sleep: "Sleep Machine", button: "Button", unknown: "Unknown" };

    function esc(s) {
      return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    }

    function fmtUptime(s) {
      if (s == null) return "";
      const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
      if (d) return `up ${d}d ${h}h`;
      if (h) return `up ${h}h ${m}m`;
      return `up ${m}m`;
    }
    function fmtAgo(s) {
      if (s == null) return "";
      if (s < 60) return `${s}s ago`;
      const m = Math.floor(s / 60);
      if (m < 60) return `${m}m ago`;
      return `${Math.floor(m / 60)}h ago`;
    }

    function tile(d, maxZones) {
      const online = d.online, seen = d.status === "seen", cfg = d.configUrl;
      const cfgBtn = cfg
        ? `<a class="btn primary" href="${esc(cfg)}" target="_blank" rel="noopener">Open config</a>`
        : `<a class="btn disabled" title="${seen ? "Not registered yet" : "This device has no web config (on-device only)"}">No web config</a>`;

      // Status chips: OTA-ready (mDNS _arduino._tcp), and a live config-page reachability probe.
      const chips = [];
      if (d.otaReady) chips.push(`<span class="chip ota" title="Advertising ArduinoOTA — ready to flash over WiFi">OTA ready</span>`);
      if (cfg && d.configReachable === true) chips.push(`<span class="chip ok" title="Config page responded just now">config ✓</span>`);
      if (cfg && d.configReachable === false) chips.push(`<span class="chip bad" title="Config page not responding">config ✗</span>`);

      // Uptime · last beat · zone count (with a warn if this device sees fewer zones than others).
      const bits = [];
      const up = fmtUptime(d.uptimeSec);
      if (up) bits.push(up);
      if (online && d.lastSeenSec != null) bits.push(`beat ${fmtAgo(d.lastSeenSec)}`);
      else if (!online && d.lastSeenSec != null) bits.push(`last seen ${fmtAgo(d.lastSeenSec)}`);
      let zc = "";
      if (!seen && d.zoneCount != null) {
        const short = maxZones > 0 && d.zoneCount < maxZones;
        zc = `<span class="${short ? "warn" : ""}" title="${short ? "sees fewer zones than other devices — possible discovery issue" : "Sonos zones this device sees"}">${d.zoneCount} zone${d.zoneCount === 1 ? "" : "s"}</span>`;
      }

      // Labeled fields — only rows that actually have a value (seen devices lack fw/board).
      const kv = [];
      if (d.ip) kv.push(["IP", esc(d.ip)]);
      if (d.fwVersion) kv.push(["Firmware", esc(d.fwVersion)]);
      if (!seen && d.board && d.board !== "unknown") kv.push(["Board", esc(d.board)]);
      if (d.mdnsName) kv.push(["mDNS", esc(d.mdnsName)]);
      const kvHtml = kv.map(([k, v]) => `<span class="k">${k}</span><span class="v"><code>${v}</code></span>`).join("");
      const summaryLine = [bits.join(" · "), zc].filter(Boolean).join(" · ");
      const badgeClass = seen ? "seen" : (d.unit || "unknown");

      return `
        <div class="card ${online ? "" : "stale"}">
          <div class="head">
            <div class="row">
              <span class="dot ${online ? "on" : ""}" title="${online ? "online" : "offline"}"></span>
              <span class="name">${esc(d.deviceName || d.mdnsName || "device")}</span>
            </div>
            <span class="badge ${badgeClass}">${seen ? "seen" : esc(UNIT_LABEL[d.unit] || d.unit)}</span>
          </div>
          <div class="meta">
            <div class="kv">${kvHtml}</div>
            ${summaryLine ? `<div>${summaryLine}</div>` : ""}
          </div>
          ${chips.length ? `<div class="chips">${chips.join("")}</div>` : ""}
          <div class="actions">${cfgBtn}</div>
        </div>`;
    }

    async function refresh() {
      try {
        const r = await fetch(API("api/devices"), { cache: "no-store" });
        const { devices, zones } = await r.json();
        const grid = document.getElementById("grid");
        document.getElementById("empty").hidden = devices.length > 0;

        const maxZones = devices.reduce((m, d) => Math.max(m, d.zoneCount || 0), 0);
        grid.innerHTML = devices.map((d) => tile(d, maxZones)).join("");

        const on = devices.filter((d) => d.online).length;
        document.getElementById("summary").textContent =
          `${devices.length} device${devices.length === 1 ? "" : "s"} · ${on} online`;

        const z = document.getElementById("zones");
        if (zones && zones.length) {
          z.innerHTML = `<b>Sonos zones (${zones.length}):</b> ${zones.map((x) => esc(x.name)).join(" · ")}`;
        } else {
          z.textContent = "";
        }
      } catch (e) {
        document.getElementById("summary").textContent = "portal unreachable";
      }
    }

    async function portalInfo() {
      try {
        const r = await fetch(API("api/portal"), { cache: "no-store" });
        const i = await r.json();
        document.getElementById("portalInfo").textContent = `Advertising ${i.service} at ${i.host}:${i.port}`;
      } catch (e) { /* non-fatal */ }
    }

    refresh();
    portalInfo();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
