# Home Assistant add-on manifest. The add-on IS the base sonos-portal image plus this thin glue:
# ingress (so it shows in the HA sidebar), host networking (mDNS), and one option translated to an
# env var by run.sh. Add-ons get a persistent /data automatically — that's where the registry
# JSON lives, so no map: entry is needed for it.
name: Sonos Portal
version: "0.1.0"
slug: sonos_portal
description: LAN dashboard your sonos-nest devices self-register with — one click into each web config.
url: https://github.com/wjduenow/sonos-nest/tree/main/sonos-portal
arch:
  - aarch64
  - amd64
  - armv7
init: false

# mDNS multicast needs the host's LAN interface directly — the same reason the standalone compose
# uses network_mode: host. Without this, devices can't discover the portal nor be browsed.
host_network: true

# Serve the dashboard inside the HA UI. ingress_port must match the port the app listens on;
# run.sh starts uvicorn on 8000. The SPA uses relative URLs + honors X-Ingress-Path, so it renders
# correctly under /api/hassio_ingress/<token>/.
ingress: true
ingress_port: 8000
panel_icon: mdi:speaker-multiple
panel_title: Sonos Portal

# Optional direct access alongside ingress (handy for the firmware/curl tests); ingress is the
# normal way in.
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: Dashboard + registration API (Ingress is the normal path; this is for devices/curl)

options:
  portal_host: ""
schema:
  portal_host: "str?"
