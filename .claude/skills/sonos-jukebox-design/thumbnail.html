<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="./styles.css"><style>
html,body{margin:0;height:100%}
body{font-family:var(--font-ui);display:flex}
.main{flex:1;background:var(--mat-case);display:grid;place-items:center;padding:6% 5%}
.mark{font-weight:800;letter-spacing:-.03em;color:var(--ink-900);line-height:.92;text-align:center}
.mark b{display:block;font-size:19vh}
.mark span{display:block;font-size:19vh;color:var(--accent)}
.strip{width:22%;display:flex;flex-direction:column}
.strip div{flex:1}
</style></head><body>
<div class="main"><div class="mark"><b>Jukebox</b></div></div>
<div class="strip">
  <div style="background:var(--amber-soft)"></div>
  <div style="background:var(--amber)"></div>
  <div style="background:var(--teal)"></div>
  <div style="background:var(--amber-deep)"></div>
</div>
</body></html>
