<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;font-family:var(--font-ui);background:var(--screen-bg);color:var(--screen-text)}
#r{padding:24px;display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:start}
.lbl{font:700 10px/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--screen-text-dim);margin-bottom:10px}
.stack{display:flex;flex-direction:column;gap:18px}</style></head>
<body><div id="r"></div>
<script type="text/babel">
const { ListRow, Scrubber, VolumeBar, Badge } = window.SonosJukeboxDesignSystem_e55a41;
function Demo(){return (
  <>
    <div><div className="lbl">List rows</div>
      <ListRow title="BBC Radio 6 Music" subtitle="Now: Lauren Laverne" playing artColor="#7a3b2e" trailing={<Badge tone="live">LIVE</Badge>} />
      <ListRow title="Teardrop" subtitle="Massive Attack" artColor="#2b3a52" selected trailing={<Badge>FLAC</Badge>} />
      <ListRow title="KEXP 90.3" subtitle="Seattle" artColor="#3a5240" />
    </div>
    <div className="stack">
      <div><div className="lbl">Scrubber</div><Scrubber elapsed={84} duration={251} /></div>
      <div><div className="lbl">Live</div><Scrubber live /></div>
      <div><div className="lbl">Volume</div><VolumeBar value={64} /></div>
      <div><div className="lbl">Muted</div><VolumeBar muted /></div>
    </div>
  </>
);}
ReactDOM.createRoot(document.getElementById('r')).render(<Demo/>);
setTimeout(()=>window.lucide&&lucide.createIcons(),60);
</script></body></html>
