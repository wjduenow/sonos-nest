<!-- @dsCard group="Colors" viewport="700x150" name="Physical materials" subtitle="Printed case, anodized dial, soft-touch caps, screen glass" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-ui);background:var(--surface-1);padding:18px}
.row{display:flex;gap:12px}
.chip{flex:1;text-align:center}
.disc{height:70px;border-radius:var(--r-md);box-shadow:var(--shadow-md);margin-bottom:8px}
.n{font-size:12px;font-weight:600;color:var(--ink-900)}
.d{font-size:11px;color:var(--ink-500)}
</style></head><body><div class="row">
<div class="chip"><div class="disc" style="background:var(--mat-case)"></div><div class="n">Case</div><div class="d">matte warm-white PETG</div></div>
<div class="chip"><div class="disc" style="background:linear-gradient(145deg,var(--mat-knob-hi),var(--mat-knob))"></div><div class="n">Dial</div><div class="d">anodized dark aluminium</div></div>
<div class="chip"><div class="disc" style="background:var(--mat-button);border:1px solid var(--line)"></div><div class="n">Buttons</div><div class="d">soft-touch caps</div></div>
<div class="chip"><div class="disc" style="background:var(--mat-glass)"></div><div class="n">Glass</div><div class="d">screen, off-state</div></div>
</div></body></html>
