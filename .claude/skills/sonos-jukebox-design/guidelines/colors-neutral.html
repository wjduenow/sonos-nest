<!-- @dsCard group="Colors" viewport="700x150" name="Neutral ink & surface ramp" subtitle="The matte-white world every physical + doc surface lives in" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-ui);background:var(--surface-1);padding:18px}
.row{display:flex;gap:10px}
.sw{flex:1;height:96px;border-radius:var(--r-md);border:var(--border-hair);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box}
.n{font-size:11px;font-weight:600;color:var(--ink-900)}
.h{font-family:var(--font-mono);font-size:10px;color:var(--ink-500)}
</style></head><body><div class="row">
<div class="sw" style="background:var(--ink-900)"><span class="n" style="color:#fff">ink-900</span><span class="h" style="color:#b8bdc4">#16181c</span></div>
<div class="sw" style="background:var(--ink-700)"><span class="n" style="color:#fff">ink-700</span><span class="h" style="color:#c9ced4">#3a3f47</span></div>
<div class="sw" style="background:var(--ink-500)"><span class="n" style="color:#fff">ink-500</span><span class="h" style="color:#e6e8ec">#6b7280</span></div>
<div class="sw" style="background:var(--ink-300)"><span class="n">ink-300</span><span class="h">#b8bdc4</span></div>
<div class="sw" style="background:var(--surface-2)"><span class="n">surface-2</span><span class="h">#eef0f3</span></div>
<div class="sw" style="background:var(--surface-1)"><span class="n">surface-1</span><span class="h">#f6f7f9</span></div>
<div class="sw" style="background:var(--surface-0)"><span class="n">surface-0</span><span class="h">#ffffff</span></div>
</div></body></html>
