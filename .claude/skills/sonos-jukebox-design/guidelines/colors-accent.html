<!-- @dsCard group="Colors" viewport="700x160" name="Accent exploration" subtitle="Three candidate accents — amber (live), teal, coral" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-ui);background:var(--surface-1);padding:18px}
.set{display:flex;gap:22px}
.fam{flex:1}
.head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.dot{width:14px;height:14px;border-radius:999px}
.name{font-size:13px;font-weight:700;color:var(--ink-900)}
.tag{font-family:var(--font-mono);font-size:10px;color:var(--ink-500);margin-left:auto}
.bar{display:flex;height:56px;border-radius:var(--r-md);overflow:hidden;border:var(--border-hair)}
.bar div{flex:1}
.live{font-family:var(--font-mono);font-size:10px;color:var(--accent-deep);font-weight:700}
</style></head><body><div class="set">
<div class="fam"><div class="head"><span class="dot" style="background:var(--amber)"></span><span class="name">Amber</span><span class="live">● LIVE</span></div><div class="bar"><div style="background:var(--amber-soft)"></div><div style="background:var(--amber)"></div><div style="background:var(--amber-deep)"></div></div></div>
<div class="fam"><div class="head"><span class="dot" style="background:var(--teal)"></span><span class="name">Teal</span><span class="tag">#2fa5a0</span></div><div class="bar"><div style="background:var(--teal-soft)"></div><div style="background:var(--teal)"></div><div style="background:var(--teal-deep)"></div></div></div>
<div class="fam"><div class="head"><span class="dot" style="background:var(--coral)"></span><span class="name">Coral</span><span class="tag">#f0605a</span></div><div class="bar"><div style="background:var(--coral-soft)"></div><div style="background:var(--coral)"></div><div style="background:var(--coral-deep)"></div></div></div>
</div></body></html>
