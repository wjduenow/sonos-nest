<!-- @dsCard group="Type" viewport="700x230" name="Hanken Grotesk — UI scale" subtitle="Display through caption, on-glass sizing" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-ui);background:var(--surface-1);color:var(--ink-900);padding:20px}
.line{display:flex;align-items:baseline;gap:14px;padding:5px 0;border-bottom:1px dashed var(--line)}
.line:last-child{border:0}
.spec{font-family:var(--font-mono);font-size:10px;color:var(--ink-400);width:120px;flex:none}
</style></head><body>
<div class="line"><span class="spec">hero / 44 / 800</span><span style="font-size:var(--fs-hero);font-weight:800;letter-spacing:var(--tracking-tight)">Now Playing</span></div>
<div class="line"><span class="spec">title / 30 / 700</span><span style="font-size:var(--fs-title);font-weight:700">Kitchen · Living</span></div>
<div class="line"><span class="spec">subtitle / 20 / 600</span><span style="font-size:var(--fs-subtitle);font-weight:600">BBC Radio 6 Music</span></div>
<div class="line"><span class="spec">body / 17 / 400</span><span style="font-size:var(--fs-body)">Grouped with Bedroom</span></div>
<div class="line"><span class="spec">caption / 13 / 500</span><span style="font-size:var(--fs-caption);font-weight:500;color:var(--ink-500)">FLAC · 44.1 kHz</span></div>
</body></html>
