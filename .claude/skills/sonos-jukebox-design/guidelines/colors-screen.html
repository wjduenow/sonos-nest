<!-- @dsCard group="Colors" viewport="700x150" name="Screen chrome (on-glass)" subtitle="Near-black UI surfaces for the OLED-like panel" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-ui);background:var(--surface-1);padding:18px}
.stage{background:var(--screen-bg);border-radius:var(--r-lg);padding:16px;display:flex;gap:10px}
.sw{flex:1;height:80px;border-radius:var(--r-sm);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box;border:1px solid var(--screen-line)}
.n{font-size:11px;font-weight:600;color:var(--screen-text)}
.h{font-family:var(--font-mono);font-size:10px;color:var(--screen-text-dim)}
</style></head><body><div class="stage">
<div class="sw" style="background:var(--screen-bg)"><span class="n">screen-bg</span><span class="h">#0e0f12</span></div>
<div class="sw" style="background:var(--screen-elev)"><span class="n">elev</span><span class="h">#191b20</span></div>
<div class="sw" style="background:var(--screen-elev-2)"><span class="n">elev-2</span><span class="h">#23262d</span></div>
<div class="sw" style="background:var(--accent);border-color:var(--accent)"><span class="n">accent</span><span class="h" style="color:#fff">on-glass</span></div>
</div></body></html>
