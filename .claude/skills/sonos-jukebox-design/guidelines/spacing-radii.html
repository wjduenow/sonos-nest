<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="xs → xl plus pill; case radius scaled for physical parts" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-ui);background:var(--surface-1);padding:20px;display:flex;gap:14px;align-items:flex-start}
.c{text-align:center}
.b{width:74px;height:56px;background:var(--surface-0);border:var(--border-hair);box-shadow:var(--shadow-sm)}
.l{font-family:var(--font-mono);font-size:10px;color:var(--ink-500);margin-top:7px}
</style></head><body>
<div class="c"><div class="b" style="border-radius:var(--r-xs)"></div><div class="l">xs·6</div></div>
<div class="c"><div class="b" style="border-radius:var(--r-sm)"></div><div class="l">sm·10</div></div>
<div class="c"><div class="b" style="border-radius:var(--r-md)"></div><div class="l">md·14</div></div>
<div class="c"><div class="b" style="border-radius:var(--r-lg)"></div><div class="l">lg·20</div></div>
<div class="c"><div class="b" style="border-radius:var(--r-xl)"></div><div class="l">xl·28</div></div>
<div class="c"><div class="b" style="border-radius:var(--r-pill)"></div><div class="l">pill</div></div>
</body></html>
