<!-- @dsCard group="Spacing" viewport="700x170" name="Elevation & inset" subtitle="Soft physical shadows + recessed insets" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-ui);background:var(--surface-1);padding:26px;display:flex;gap:20px;align-items:center}
.c{text-align:center}
.b{width:96px;height:66px;background:var(--surface-0);border-radius:var(--r-md)}
.l{font-family:var(--font-mono);font-size:10px;color:var(--ink-500);margin-top:10px}
</style></head><body>
<div class="c"><div class="b" style="box-shadow:var(--shadow-sm)"></div><div class="l">shadow-sm</div></div>
<div class="c"><div class="b" style="box-shadow:var(--shadow-md)"></div><div class="l">shadow-md</div></div>
<div class="c"><div class="b" style="box-shadow:var(--shadow-lg)"></div><div class="l">shadow-lg</div></div>
<div class="c"><div class="b" style="background:var(--surface-2);box-shadow:var(--inset-well)"></div><div class="l">inset-well</div></div>
</body></html>
