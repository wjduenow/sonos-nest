# Marks this repo as a Home Assistant add-on repository, so it can be added to the HA add-on store
# by URL (https://github.com/wjduenow/sonos-nest). The Supervisor then discovers each top-level
# folder that contains a config.yaml as an installable add-on — here, sonos-portal/. The firmware
# in src/ etc. is ignored (no config.yaml). See sonos-portal/INSTALL-HOMEASSISTANT.md.
name: Sonos Nest add-ons
url: https://github.com/wjduenow/sonos-nest
maintainer: wjduenow <wjduenow@gmail.com>
