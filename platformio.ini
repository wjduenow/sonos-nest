; Sonos Nest — ELECROW CrowPanel 2.1" HMI ESP32-S3 Rotary Display (DHE03921D)
; ESP32-S3R8: dual-core 240 MHz, 8 MB OPI PSRAM, 16 MB flash, ST7701 480x480 RGB panel.
; See plans/01-sonos-knob-controller-plan.md for the full architecture.
;
; Envs (one board + one unit + core each, selected via build_src_filter):
;   nest / sleep-machine  -> the apps
;   nest-bringup          -> Phase-0 serial subsystem self-test (-DPHASE0_BRINGUP)
;   nest-phase1           -> interactive Sonos SOAP test (-DPHASE1_TEST)
;   nest-ota / sleep-machine-ota -> espota WiFi upload

[platformio]
default_envs = nest

[env]
; PINNED — do not loosen. 6.9.0 is the last platform on framework-arduinoespressif32 ~3.20017
; (Arduino core 2.0.17 / IDF 4.4), which every ESP32-S3 unit here is written and tested against.
; This pin is load-bearing for a second reason: the sonos-jukebox envs are ESP32-P4, which the
; official platform doesn't support at all, so they pull the pioarduino fork — and that fork also
; publishes itself as "espressif32". Leave this bare and an unrelated `pio platform install` of
; the fork silently retargets nest/sleep-machine to Arduino 3.x. See plans/07-sonos-jukebox.md.
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; Inject FW_VERSION (git describe) into every build — reported to the sonos-portal dashboard.
extra_scripts = pre:tools/git_version.py

; --- ESP32-S3R8: enable 8 MB OPI PSRAM + 16 MB flash ---
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1      ; USB-CDC serial over the USB-C port
    -DCORE_DEBUG_LEVEL=3
    -DLV_CONF_INCLUDE_SIMPLE         ; LVGL looks for lv_conf.h on the include path
    -I include
    -I src                           ; root-relative includes (core/…, boards/…, units/…)
    ; -DSONOS_ZONE_IP=\"192.168.1.50\"  ; uncomment to bypass SSDP during dev (Phase 1)

lib_deps =
    lvgl/lvgl@^9.2.0
    ; Pinned to 1.3.1 — the version Elecrow's example targets. The 1.4.x refactor
    ; (Arduino_SWSPI + Arduino_RGB_Display) drops the Arduino_ST7701_RGBPanel /
    ; Arduino_ESP32RGBPanel(CS,SCK,SDA,DE,…) API that display.cpp uses. Do NOT bump
    ; without rewriting display.cpp. (registry name doesn't resolve @1.3.1, so pin the tag)
    https://github.com/moononournation/Arduino_GFX.git#v1.3.1
    bblanchon/ArduinoJson@^7.1.0
    bodmer/TJpg_Decoder@^1.1.0
    madhephaestus/ESP32Encoder@^0.11.7

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

; ============================================================================
; Per-unit envs. Each unit = one board (src/boards/<board>/) + one UX
; (src/units/<unit>/) + the shared core (src/core/), selected via
; build_src_filter. Exactly one board + one unit per env (two would collide on
; boardInit()/uiInit() at link — a deliberate safety net). The filter uses the
; exclude-then-include form because setting build_src_filter drops PlatformIO's
; implicit +<*>.
; ============================================================================

; --- nest: round 2.1" rotary CrowPanel (the original unit) ---
[env:nest]
build_flags =
    ${env.build_flags}
    -DUNIT_NEST
    -DDEVICE_HOSTNAME='"sonos-nest"'
build_src_filter =
    -<*>
    +<main.cpp>
    +<core/>
    +<boards/crowpanel_rotary/>
    +<units/sonos_nest/>

; --- sleep-machine: rectangular 2.8" ES3C28P nightstand sleep-sound player ---
[env:sleep-machine]
; C++17 is required by arduino-audio-driver (used by local_audio.cpp for the ES8311 codec) —
; it ODR-uses static constexpr members that only get defined under C++17; the core defaults
; to gnu++11. LVGL/Arduino_GFX/core compile fine under C++17.
build_unflags = -std=gnu++11
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -DUNIT_SLEEP
    -DDEVICE_HOSTNAME='"sonos-sleep"'
    ; --- TFLM (wake_word.cpp). These must match lib/tflm/library.json's flags: library.json
    ; only configures the library's OWN sources, so any src/ file that includes a TFLM header
    ; needs them repeated here. TF_LITE_STATIC_MEMORY is not an optimization — it selects a
    ; different TfLiteTensor field order. Mismatch it and tensor pointers still look sane while
    ; every field read through them is garbage (scale=-nan), which crashes on first inference.
    -DTF_LITE_STATIC_MEMORY
    -DTF_LITE_DISABLE_X86_NEON
    ; TFLM makes operator delete private (TF_LITE_REMOVE_VIRTUAL_DELETE); its placement-new
    ; sites only compile with exceptions off — see lib/tflm/VENDORING.md.
    -fno-exceptions
build_src_filter =
    -<*>
    +<main.cpp>
    +<core/>
    +<boards/es3c28p/>
    -<boards/es3c28p/sd_msc.cpp>       ; standalone USB-MSC bring-up (its own env)
    -<boards/es3c28p/audio_test.cpp>   ; standalone audio bring-up (its own env)
    -<boards/es3c28p/mic_test.cpp>     ; standalone mic bring-up (its own env)
    -<boards/es3c28p/wake_test.cpp>    ; standalone wake-word bring-up (its own env; wake_word.cpp
                                       ; is the real thing the app uses)
    +<units/sleep_machine/>
lib_deps =
    ${env.lib_deps}
    https://github.com/pschatzmann/arduino-audio-tools.git
    https://github.com/pschatzmann/arduino-audio-driver.git
    https://github.com/pschatzmann/arduino-libhelix.git   ; MP3DecoderHelix

; --- nest test/flash variants ---
[env:nest-bringup]
; Phase-0 hardware self-test over serial:  pio run -e nest-bringup -t upload
extends = env:nest
build_flags = ${env:nest.build_flags} -DPHASE0_BRINGUP

[env:nest-phase1]
; Phase-1 Sonos SOAP test (needs include/secrets.h):  pio run -e nest-phase1 -t upload
; Add -DSONOS_SOAP_TRACE=1 to log every SOAP envelope.
extends = env:nest
build_flags = ${env:nest.build_flags} -DPHASE1_TEST

[env:nest-ota]
; Flash the nest app over WiFi (no USB). Requires the build host to reach the device.
;   pio run -e nest-ota -t upload                       (mDNS sonos-nest.local)
;   pio run -e nest-ota -t upload --upload-port <device-ip>
extends = env:nest
upload_protocol = espota
upload_port = sonos-nest.local

[env:sleep-machine-ota]
; Flash the sleep-machine app over WiFi (once the board is functional).
extends = env:sleep-machine
upload_protocol = espota
upload_port = sonos-sleep.local

; --- sleep-machine SD -> USB mass-storage bridge ---
; Exposes the inserted microSD to the host as a removable USB drive (drop files on the card
; without pulling it). Switches the USB port to TinyUSB OTG (MSC), replacing the USB-Serial-
; JTAG that normal builds flash over — so after running this, re-flashing the app may need
; download mode (hold BOOT, tap RST). Build/flash:  pio run -e sleep-machine-sdreader -t upload
; --- sleep-machine local-audio bring-up ---
; Standalone test: play the ocean-sounds MP3 off the microSD through the onboard ES8311
; codec + speaker (SD -> Helix MP3 -> I2S -> ES8311). Proves the audio path before it's
; wired into the app as "Play on Device".  pio run -e sleep-machine-audio -t upload
[env:sleep-machine-audio]
; arduino-audio-driver ODR-uses static constexpr members (register addresses) that only get
; a definition under C++17; the core defaults to gnu++11, which leaves them undefined at link.
build_unflags = -std=gnu++11
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -DAUDIO_BRINGUP
    -DDEVICE_HOSTNAME='"sonos-sleep"'
build_src_filter =
    -<*>
    +<main.cpp>
    +<boards/es3c28p/audio_test.cpp>
lib_deps =
    https://github.com/pschatzmann/arduino-audio-tools.git
    https://github.com/pschatzmann/arduino-audio-driver.git
    https://github.com/pschatzmann/arduino-libhelix.git   ; MP3DecoderHelix

; --- sleep-machine microphone bring-up (Phase 0 for wake-word / voice control) ---
; Standalone test: capture PCM off the ES8311 mic at 16 kHz mono and print a live level meter +
; free internal-SRAM headroom. Proves the record path (never used before) and measures the
; resource a wake-word engine is tightest against, before committing to one.
;   pio run -e sleep-machine-mic -t upload && python3 tools/readser.py /dev/ttyACMx 30
[env:sleep-machine-mic]
; C++17 for arduino-audio-driver (same reason as sleep-machine-audio).
build_unflags = -std=gnu++11
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -DMIC_BRINGUP
    -DDEVICE_HOSTNAME='"sonos-sleep"'
build_src_filter =
    -<*>
    +<main.cpp>
    +<boards/es3c28p/mic_test.cpp>
lib_deps =
    https://github.com/pschatzmann/arduino-audio-tools.git
    https://github.com/pschatzmann/arduino-audio-driver.git

; --- sleep-machine wake-word bring-up (Phase 1 for on-device wake word) ---
; Standalone TFLM + microWakeWord trial. Step 1 proves TensorFlow Lite Micro builds on this core
; and a v2 model loads with its arena in PSRAM; later steps add the feature frontend + inference.
;   pio run -e sleep-machine-wake -t upload && python3 tools/readser.py /dev/ttyACMx 20
[env:sleep-machine-wake]
build_unflags = -std=gnu++11
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -DWAKE_BRINGUP
    -DDEVICE_HOSTNAME='"sonos-sleep"'
    ; TFLM: reference kernels (no esp-nn in this Arduino port), keep its asserts quiet.
    -DTF_LITE_STATIC_MEMORY
    -DTF_LITE_DISABLE_X86_NEON
    ; TFLM makes operator delete private (TF_LITE_REMOVE_VIRTUAL_DELETE); its placement-new
    ; sites only compile with exceptions off — which is also how the Arduino core is built.
    -fno-exceptions
build_src_filter =
    -<*>
    +<main.cpp>
    +<boards/es3c28p/wake_test.cpp>
lib_deps =
    ; TFLM is vendored in lib/tflm (esp-tflite-micro core + classic microfrontend) — not a registry dep.
    https://github.com/pschatzmann/arduino-audio-tools.git
    https://github.com/pschatzmann/arduino-audio-driver.git

; ============================================================================
; sonos-button — nulllab/emakefun ESP32-S3-CAM, one physical button, no screen.
; Press = start the configured Sonos sleep playlist (looped); press again = stop.
; See plans/04-sonos-button-plan.md.
;
; NOTE: this board has 8 MB flash (the nest/sleep-machine boards have 16), so every
; sonos-button env MUST override flash_size + partitions. 8 MB still gives 3.3 MB per
; OTA slot vs a ~1 MB headless build, so it's a config detail, not a constraint.
; ============================================================================

; --- Phase-0 bring-up: prove the board, the button pin and the status-LED guess ---
; Standalone (links neither core/ nor a unit — those arrive in Phase 1), like the es3c28p
; audio/mic/wake bring-ups. Blinks the LEDs and prints live button transitions:
;   pio run -e sleep-button-bringup -t upload && python3 tools/readser.py /dev/ttyACMx 30
[env:sleep-button-bringup]
board_build.partitions  = default_8MB.csv
board_upload.flash_size = 8MB
build_flags =
    ${env.build_flags}
    -DBUTTON_BRINGUP
    -DDEVICE_HOSTNAME='"sonos-button"'
build_src_filter =
    -<*>
    +<main.cpp>
    +<boards/esp32s3cam/bringup.cpp>
lib_deps =
    ; none — this test is Arduino-core only. Overrides the root lib_deps so a headless
    ; board never pulls LVGL / Arduino_GFX / TJpg into the build.

; --- The app: headless, one button, config page on :8080 ---
; No LVGL / Arduino_GFX / TJpg / audio / TFLM — -DHEADLESS drops the core's only graphics
; coupling (album_art) so none of it is even reachable. lib_deps is overridden to just JSON.
[env:sleep-button]
board_build.partitions  = default_8MB.csv
board_upload.flash_size = 8MB
build_flags =
    ${env.build_flags}
    -DHEADLESS
    -DDEVICE_HOSTNAME='"sonos-button"'
build_src_filter =
    -<*>
    +<main.cpp>
    +<core/>
    -<core/album_art.cpp>          ; LVGL + TJpg; no display on this unit
    +<boards/esp32s3cam/>
    -<boards/esp32s3cam/bringup.cpp>   ; the Phase-0 self-test; its own env below
    +<units/sleep_button/>
lib_deps =
    bblanchon/ArduinoJson@^7.1.0

[env:sleep-button-ota]
extends = env:sleep-button
upload_protocol = espota
upload_port = sonos-button.local

[env:sleep-machine-sdreader]
build_unflags = -DARDUINO_USB_MODE=1     ; drop the board default so our OTG mode wins cleanly
build_flags =
    ${env.build_flags}
    -DSD_MSC_MODE
    -DARDUINO_USB_MODE=0             ; TinyUSB OTG stack (required for USB MSC)
    -DDEVICE_HOSTNAME='"sonos-sleep"'
build_src_filter =
    -<*>
    +<main.cpp>
    +<boards/es3c28p/sd_msc.cpp>

; ============================================================================
; sonos-jukebox — ELECROW CrowPanel Advance 7" ESP32-P4 (1024x600 MIPI-DSI).
;
; DIFFERENT SILICON, DIFFERENT TOOLCHAIN. The P4 is RISC-V and is not supported by the
; official espressif32 platform at any version, so these envs pull the **pioarduino** fork
; (Arduino core 3.3.11 / IDF 5.5.5). That fork publishes itself under the name "espressif32"
; too, which is exactly why [env] pins `platform = espressif32@6.9.0` — without that pin,
; installing this fork silently retargets the S3 units to Arduino 3.x. Don't unpin either side.
;
; Consequences to keep in mind (see plans/07-sonos-jukebox.md):
;   - The P4 has NO radio. Wi-Fi is an ESP32-C6-MINI-1 over SDIO via ESP-Hosted. Anything
;     that depends on multicast (our SSDP discovery) must be proven on real hardware.
;   - src/core/ is written against Arduino 2.0.17; it is NOT yet known to compile under 3.x.
;     That is why the bring-up env below deliberately excludes core/ — screen first.
; ============================================================================
[jukebox_base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
; boards/crowpanel-p4-7in.json — the real Elecrow board definition, taken from the vendor-linked
; C6 upgrade project (github.com/mverch67/crowpanel-advanced-p4-c6-upgrade). Do NOT substitute a
; stock esp32-p4* profile: they get chip_variant and the ESP-Hosted SDIO wiring wrong. This one
; declares chip_variant esp32p4_es (engineering sample — matches this unit's "ESP-ROM:esp32p4-eco2"
; banner; the rev.300 profile boot-loops with an Illegal instruction inside the bootloader) and
; hwids 1A86:7522, the CH340K the board enumerates as.
board = crowpanel-p4-7in
; Project-local variants/ carries crowpanel_p4_7in, which fixes the ESP-Hosted C6 reset pin.
; NOTE: setting this makes PlatformIO look for the variant ONLY here, so any variant named by a
; board json in this project must exist under variants/.
board_build.variants_dir = variants
board_upload.flash_size = 16MB
; Vendored copy of the framework's default_16MB.csv. custom_sdkconfig makes PlatformIO build
; this as an ESP-IDF project, and in that mode board_build.partitions is resolved relative to
; the PROJECT dir, not the framework's tools/partitions — a bare "default_16MB.csv" fails with
; "Missing partition table file <project>/default_16MB.csv".
board_build.partitions = src/boards/crowpanel_p4_7in/partitions_16mb.csv
; Neutralise the S3-only OPI settings inherited from [env]: any memory_type containing "opi"
; sends the builder down an ESP32-S3 octal-flash path. The P4's PSRAM is in-package.
board_build.arduino.memory_type = qio_qspi
board_build.psram_type = qspi

; --- ESP-Hosted SDIO wiring for the 7" board -------------------------------------------------
; The P4 has no radio; Wi-Fi is an ESP32-C6-MINI-1 reached over SDIO. These pins are NOT
; guessable and are NOT the same across the CrowPanel range — the 5" uses a 4-bit bus on
; GPIO49-54 with reset on GPIO20. Getting them wrong does not fail loudly: the board boots,
; Arduino brings up ESP-Hosted, and then the transport dies with
;   sdmmc_io_rw_extended: sdmmc_send_cmd returned 0x109   (ESP_ERR_TIMEOUT)
; which reads like broken hardware. Verified working on this unit — the C6 upgrade app
; reported "Connected to C6 slave in 1886ms" with exactly this config.
custom_sdkconfig =
  ; --- FATFS must match the SD card's geometry ---------------------------------------------
  ; The inherited defaults carry CONFIG_FATFS_SECTOR_4096, which exists for wear-levelled SPI
  ; flash. SD cards report 512-byte sectors (this one: "CSD: ver=2, sector_size=512"), and with
  ; the 4096 option FatFs fixes FF_MIN_SS=FF_MAX_SS=4096 and never asks the disk — so every LBA
  ; and transfer length it computes is 8x wrong. It does NOT fail cleanly: 4 KB writes work
  ; (exactly one FatFs "sector"), anything larger becomes a multi-sector transfer that asks the
  ; card for 8x the data and dies as sdmmc_write_blocks failed (0x107) — a TIMEOUT, which reads
  ; like bad hardware. Hours went into the card, the pins, the bus clock and the LDO before the
  ; raw-block sweep proved sdmmc_write_sectors was perfect across the whole card at every size.
  ; Symptom to recognise: raw sector I/O flawless, everything through fopen/fwrite timing out.
  CONFIG_FATFS_SECTOR_512=y
  CONFIG_FATFS_SECTOR_4096=n
  ; FatFs's own window/cache buffers are handed straight to SDMMC DMA. Keep them in internal RAM
  ; rather than PSRAM — they are small, internal RAM is not tight on this board (~400 KB free),
  ; and it removes a whole class of DMA alignment/cache questions from the SD path.
  CONFIG_FATFS_ALLOC_PREFER_EXTRAM=n

  CONFIG_ESP_HOSTED_ENABLED=y
  CONFIG_ESP_WIFI_REMOTE_ENABLED=y
  CONFIG_ESP_HOSTED_P4_DEV_BOARD_NONE=y
  CONFIG_ESP_HOSTED_IDF_SLAVE_TARGET="esp32c6"
  CONFIG_ESP_HOSTED_CP_TARGET_ESP32C6=y
  CONFIG_ESP_HOSTED_CP_TARGET_ESP32H2=n
  CONFIG_ESP_HOSTED_PRIV_SDIO_OPTION=y
  CONFIG_ESP_HOSTED_SPI_HOST_INTERFACE=n
  CONFIG_ESP_HOSTED_SDIO_HOST_INTERFACE=y
  CONFIG_ESP_HOSTED_TRANSPORT_SDIO=y
  CONFIG_ESP_HOSTED_SDIO_SLOT_1=y
  CONFIG_ESP_HOSTED_SDIO_1_BIT_BUS=y
  CONFIG_ESP_HOSTED_SDIO_BUS_WIDTH=1
  CONFIG_ESP_HOSTED_SDIO_CLOCK_FREQ_KHZ=10000
  CONFIG_ESP_HOSTED_PRIV_SDIO_PIN_CLK_SLOT_1=18
  CONFIG_ESP_HOSTED_PRIV_SDIO_PIN_CMD_SLOT_1=19
  CONFIG_ESP_HOSTED_PRIV_SDIO_PIN_D0_SLOT_1=14
  CONFIG_ESP_HOSTED_PRIV_SDIO_PIN_D1_1BIT_BUS_SLOT_1=15
  CONFIG_ESP_HOSTED_SDIO_RESET_ACTIVE_HIGH=y
  CONFIG_ESP_HOSTED_SDIO_GPIO_RESET_SLAVE=32
  CONFIG_ESP_HOSTED_GPIO_SLAVE_RESET_SLAVE=32
  CONFIG_ESP_HOSTED_SDIO_RESET_DELAY_MS=1500
  CONFIG_ESP_HOSTED_SLAVE_RESET_ON_EVERY_HOST_BOOTUP=y

; git_version.py is inherited from [env] but naming extra_scripts here REPLACES it, so all three
; are listed. p4_maxlinelength.py dodges a SCons 4.8.1 crash; p4_hosted_patch.py supplies the
; linker symbol aliases and esp_wifi_remote Kconfig patch that custom_sdkconfig + esp_hosted
; need on the P4 (vendored from the same upstream project as the board JSON).
extra_scripts =
    pre:tools/git_version.py
    post:tools/p4_maxlinelength.py
    pre:tools/p4_hosted_patch.py

; --- Screen bring-up: MIPI-DSI panel + GT911 touch + LVGL, and nothing else. ---
; No core/, no unit, no networking — this env exists to answer "does the panel light up and
; does LVGL render at a usable frame rate" before any of the app is ported to Arduino 3.x.
;   pio run -e jukebox-bringup -t upload
[env:jukebox-bringup]
extends = jukebox_base
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    ; NOT ARDUINO_USB_CDC_ON_BOOT — this board's serial is the CH340K UART
    ; bridge on one USB-C port, i.e. plain Serial/UART0. Setting the CDC flag
    ; breaks the IDF-mode build outright: HardwareSerial.h references USBSerial,
    ; which isn't compiled in unless the USB-CDC sdkconfig options are on.
    -DCORE_DEBUG_LEVEL=3
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -I src
    -DJUKEBOX_BRINGUP
build_src_filter =
    -<*>
    +<boards/crowpanel_p4_7in/display_test.cpp>
; Deliberately EMPTY (not inherited): [env]'s lib_deps carry Arduino_GFX 1.3.1 and
; ESP32Encoder, neither of which is going to build for RISC-V, and stage 1 needs nothing but
; Arduino + Wire.
;
lib_deps =
    lvgl/lvgl@^9.2.0

; --- ESP-Hosted multicast / SSDP probe ---
; Answers the question the whole jukebox depends on: does an SSDP M-SEARCH survive the
; P4 <-> C6 SDIO bridge? Standalone (no core/, no LVGL) so it can run before core/ is ported.
; Needs WIFI_SSID / WIFI_PASS in include/secrets.h.
;   pio run -e jukebox-mcast -t upload && python3 tools/readser.py /dev/ttyACM0 60
[env:jukebox-mcast]
extends = jukebox_base
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    ; NOT ARDUINO_USB_CDC_ON_BOOT — this board's serial is the CH340K UART
    ; bridge on one USB-C port, i.e. plain Serial/UART0. Setting the CDC flag
    ; breaks the IDF-mode build outright: HardwareSerial.h references USBSerial,
    ; which isn't compiled in unless the USB-CDC sdkconfig options are on.
    -DCORE_DEBUG_LEVEL=3
    -I include
    -I src
    -DJUKEBOX_MCAST_TEST
build_src_filter =
    -<*>
    +<boards/crowpanel_p4_7in/multicast_test.cpp>
lib_deps =

; --- microSD bring-up + throughput probe --------------------------------------------------------
; Does the card mount on SDMMC slot 0 (the C6 is on slot 1), and is reading a cached album cover
; off it actually faster than re-fetching it over the ESP-Hosted link? Standalone: no core/, no
; LVGL, no Wi-Fi — mount, verify a byte-exact round trip, then time art-sized and bulk I/O.
;   pio run -e jukebox-sd -t upload --upload-port /dev/ttyUSB0   # then POWER CYCLE
;   python3 tools/readser.py /dev/ttyUSB0 90
[env:jukebox-sd]
extends = jukebox_base
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    ; NOT ARDUINO_USB_CDC_ON_BOOT — this board's serial is the CH340K UART
    ; bridge on one USB-C port, i.e. plain Serial/UART0. Setting the CDC flag
    ; breaks the IDF-mode build outright: HardwareSerial.h references USBSerial,
    ; which isn't compiled in unless the USB-CDC sdkconfig options are on.
    -DCORE_DEBUG_LEVEL=3
    -I include
    -I src
    -DJUKEBOX_SD_TEST
    ; Uncomment to let the probe run esp_vfs_fat_sdcard_format() when the card won't mount.
    ; *** THIS ERASES THE CARD. *** Left off by default so the probe is safe to run on anything.
    ; Note it did NOT work on the 64 GB card tried here — IDF's formatter failed on that volume
    ; while raw sector I/O was perfect across the whole card, so a PC-side `mkfs.vfat -F 32` is
    ; the reliable way to get FAT32 onto a large card. See plans/07 "microSD + on-card caching".
    ; -DSD_ALLOW_FORMAT
build_src_filter =
    -<*>
    +<boards/crowpanel_p4_7in/sd_test.cpp>
lib_deps =

; --- core/ compile check for the P4 -----------------------------------------------------------
; Compiles the shared Sonos code against Arduino 3.3.x / IDF 5.5 WITHOUT a board or unit, purely
; to triage portability. It does not link (no setup/loop, no board HAL) and is not meant to —
; compile errors are the output. Delete this env once `sonos-jukebox` builds for real.
;   pio run -e jukebox-core
[env:jukebox-core]
extends = jukebox_base
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -I src
    -DDEVICE_HOSTNAME='"sonos-jukebox"'
build_src_filter =
    -<*>
    +<core/>
lib_deps =
    lvgl/lvgl@^9.2.0
    bblanchon/ArduinoJson@^7.1.0
    bodmer/TJpg_Decoder@^1.1.0

; --- core/ RUNTIME smoke test on the P4 -------------------------------------------------------
; Drives the real shared code (settings, wifi, ssdp, soap_client, didl) on hardware — no board
; HAL, no LVGL, no UI. Compiles only the subset of core/ that has no board or LVGL coupling;
; app.cpp/album_art.cpp/webconfig.cpp and the other net/* modules are excluded because they pull
; in board.h or LVGL, which this test deliberately does without.
;   pio run -e jukebox-smoke -t upload && python3 tools/readser.py /dev/ttyUSB0 60
[env:jukebox-smoke]
extends = jukebox_base
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -I include
    -I src
    -DJUKEBOX_SMOKE_TEST
    -DDEVICE_HOSTNAME='"sonos-jukebox"'
build_src_filter =
    -<*>
    +<core/settings.cpp>
    +<core/player_state.cpp>
    +<core/net/wifi.cpp>
    +<core/sonos/>
    +<boards/crowpanel_p4_7in/core_smoke_test.cpp>
lib_deps =
    bblanchon/ArduinoJson@^7.1.0

; --- sonos-jukebox: the app ---------------------------------------------------------------------
; board (crowpanel_p4_7in) + unit (sonos_jukebox) + core, the same three-layer split as the S3
; units. The bring-up/probe files in the board directory are excluded — each has its own env.
;   pio run -e sonos-jukebox -t upload --upload-port /dev/ttyUSB0
[env:sonos-jukebox]
extends = jukebox_base
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -I src
    -DUNIT_JUKEBOX
    ; Album art decode cap. The design's Now Playing tile is 280 px on a 1024x600 panel; the
    ; shared default of 180 (sized for the 480x480 nest) is visibly soft at that size.
    -DART_MAX_PX=280
    -DDEVICE_HOSTNAME='"sonos-jukebox"'
    ; Serial bring-up console — OFF, as intended. Settings can now run the DeviceLink ceremony, so
    ; the scaffolding that existed only to get credentials into NVS has served its purpose. The file
    ; stays (it also answers `radio status`), one line from being re-enabled for debugging:
    ; -DJUKEBOX_BRINGUP_CONSOLE
build_src_filter =
    -<*>
    +<main.cpp>
    +<core/>
    +<boards/crowpanel_p4_7in/>
    -<boards/crowpanel_p4_7in/display_test.cpp>      ; jukebox-bringup env
    -<boards/crowpanel_p4_7in/multicast_test.cpp>    ; jukebox-mcast env
    -<boards/crowpanel_p4_7in/core_smoke_test.cpp>   ; jukebox-smoke env
    -<boards/crowpanel_p4_7in/sd_test.cpp>           ; jukebox-sd env
    +<units/sonos_jukebox/>
lib_deps =
    lvgl/lvgl@^9.2.0
    bblanchon/ArduinoJson@^7.1.0
    bodmer/TJpg_Decoder@^1.1.0
