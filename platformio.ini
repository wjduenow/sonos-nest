; Sonos Nest — ELECROW CrowPanel 2.1" HMI ESP32-S3 Rotary Display (DHE03921D)
; ESP32-S3R8: dual-core 240 MHz, 8 MB OPI PSRAM, 16 MB flash, ST7701 480x480 RGB panel.
; See plans/01-sonos-knob-controller-plan.md for the full architecture.
;
; Envs (one board + one unit + core each, selected via build_src_filter):
;   nest / sleep-machine  -> the apps
;   nest-bringup          -> Phase-0 serial subsystem self-test (-DPHASE0_BRINGUP)
;   nest-phase1           -> interactive Sonos SOAP test (-DPHASE1_TEST)
;   nest-ota / sleep-machine-ota -> espota WiFi upload

[platformio]
default_envs = nest

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- ESP32-S3R8: enable 8 MB OPI PSRAM + 16 MB flash ---
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1      ; USB-CDC serial over the USB-C port
    -DCORE_DEBUG_LEVEL=3
    -DLV_CONF_INCLUDE_SIMPLE         ; LVGL looks for lv_conf.h on the include path
    -I include
    -I src                           ; root-relative includes (core/…, boards/…, units/…)
    ; -DSONOS_ZONE_IP=\"192.168.1.50\"  ; uncomment to bypass SSDP during dev (Phase 1)

lib_deps =
    lvgl/lvgl@^9.2.0
    ; Pinned to 1.3.1 — the version Elecrow's example targets. The 1.4.x refactor
    ; (Arduino_SWSPI + Arduino_RGB_Display) drops the Arduino_ST7701_RGBPanel /
    ; Arduino_ESP32RGBPanel(CS,SCK,SDA,DE,…) API that display.cpp uses. Do NOT bump
    ; without rewriting display.cpp. (registry name doesn't resolve @1.3.1, so pin the tag)
    https://github.com/moononournation/Arduino_GFX.git#v1.3.1
    bblanchon/ArduinoJson@^7.1.0
    bodmer/TJpg_Decoder@^1.1.0
    madhephaestus/ESP32Encoder@^0.11.7

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

; ============================================================================
; Per-unit envs. Each unit = one board (src/boards/<board>/) + one UX
; (src/units/<unit>/) + the shared core (src/core/), selected via
; build_src_filter. Exactly one board + one unit per env (two would collide on
; boardInit()/uiInit() at link — a deliberate safety net). The filter uses the
; exclude-then-include form because setting build_src_filter drops PlatformIO's
; implicit +<*>.
; ============================================================================

; --- nest: round 2.1" rotary CrowPanel (the original unit) ---
[env:nest]
build_flags =
    ${env.build_flags}
    -DUNIT_NEST
    -DDEVICE_HOSTNAME='"sonos-nest"'
build_src_filter =
    -<*>
    +<main.cpp>
    +<core/>
    +<boards/crowpanel_rotary/>
    +<units/sonos_nest/>

; --- sleep-machine: rectangular 2.8" ES3C28P (STUB — compiles, not yet functional) ---
[env:sleep-machine]
; C++17 is required by arduino-audio-driver (used by local_audio.cpp for the ES8311 codec) —
; it ODR-uses static constexpr members that only get defined under C++17; the core defaults
; to gnu++11. LVGL/Arduino_GFX/core compile fine under C++17.
build_unflags = -std=gnu++11
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -DUNIT_SLEEP
    -DDEVICE_HOSTNAME='"sonos-sleep"'
build_src_filter =
    -<*>
    +<main.cpp>
    +<core/>
    +<boards/es3c28p/>
    -<boards/es3c28p/sd_msc.cpp>       ; standalone USB-MSC bring-up (its own env)
    -<boards/es3c28p/audio_test.cpp>   ; standalone audio bring-up (its own env)
    +<units/sleep_machine/>
lib_deps =
    ${env.lib_deps}
    https://github.com/pschatzmann/arduino-audio-tools.git
    https://github.com/pschatzmann/arduino-audio-driver.git
    https://github.com/pschatzmann/arduino-libhelix.git   ; MP3DecoderHelix

; --- nest test/flash variants ---
[env:nest-bringup]
; Phase-0 hardware self-test over serial:  pio run -e nest-bringup -t upload
extends = env:nest
build_flags = ${env:nest.build_flags} -DPHASE0_BRINGUP

[env:nest-phase1]
; Phase-1 Sonos SOAP test (needs include/secrets.h):  pio run -e nest-phase1 -t upload
; Add -DSONOS_SOAP_TRACE=1 to log every SOAP envelope.
extends = env:nest
build_flags = ${env:nest.build_flags} -DPHASE1_TEST

[env:nest-ota]
; Flash the nest app over WiFi (no USB). Requires the build host to reach the device.
;   pio run -e nest-ota -t upload                       (mDNS sonos-nest.local)
;   pio run -e nest-ota -t upload --upload-port <device-ip>
extends = env:nest
upload_protocol = espota
upload_port = sonos-nest.local

[env:sleep-machine-ota]
; Flash the sleep-machine app over WiFi (once the board is functional).
extends = env:sleep-machine
upload_protocol = espota
upload_port = sonos-sleep.local

; --- sleep-machine SD -> USB mass-storage bridge ---
; Exposes the inserted microSD to the host as a removable USB drive (drop files on the card
; without pulling it). Switches the USB port to TinyUSB OTG (MSC), replacing the USB-Serial-
; JTAG that normal builds flash over — so after running this, re-flashing the app may need
; download mode (hold BOOT, tap RST). Build/flash:  pio run -e sleep-machine-sdreader -t upload
; --- sleep-machine local-audio bring-up ---
; Standalone test: play the ocean-sounds MP3 off the microSD through the onboard ES8311
; codec + speaker (SD -> Helix MP3 -> I2S -> ES8311). Proves the audio path before it's
; wired into the app as "Play on Device".  pio run -e sleep-machine-audio -t upload
[env:sleep-machine-audio]
; arduino-audio-driver ODR-uses static constexpr members (register addresses) that only get
; a definition under C++17; the core defaults to gnu++11, which leaves them undefined at link.
build_unflags = -std=gnu++11
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -DAUDIO_BRINGUP
    -DDEVICE_HOSTNAME='"sonos-sleep"'
build_src_filter =
    -<*>
    +<main.cpp>
    +<boards/es3c28p/audio_test.cpp>
lib_deps =
    https://github.com/pschatzmann/arduino-audio-tools.git
    https://github.com/pschatzmann/arduino-audio-driver.git
    https://github.com/pschatzmann/arduino-libhelix.git   ; MP3DecoderHelix

[env:sleep-machine-sdreader]
build_unflags = -DARDUINO_USB_MODE=1     ; drop the board default so our OTG mode wins cleanly
build_flags =
    ${env.build_flags}
    -DSD_MSC_MODE
    -DARDUINO_USB_MODE=0             ; TinyUSB OTG stack (required for USB MSC)
    -DDEVICE_HOSTNAME='"sonos-sleep"'
build_src_filter =
    -<*>
    +<main.cpp>
    +<boards/es3c28p/sd_msc.cpp>
